<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FixMate · 界面原型 v3</title>
<style>
:root{
  --bg:#F5F6F8;--panel:#fff;--panel2:#FAFAFC;--line:#E6E8EC;--text:#171A21;--mut:#667085;--faint:#98A2B3;
  --acc:#5B5BD6;--acc-s:#EEEEFC;--acc-t:#4646C0;--on:#fff;
  --g:#18946A;--g-s:#E5F5EE;--r:#D4443C;--r-s:#FCEBE9;--a:#A86F00;--a-s:#FFF3D6;--gr-s:#EEF0F3;
  --sh:0 1px 2px rgba(16,24,40,.05),0 10px 30px rgba(16,24,40,.08);
  --dw:max(50vw,560px);--rw:76px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1115;--panel:#171A21;--panel2:#1B1F27;--line:#272C36;--text:#ECEEF2;--mut:#9AA3B2;--faint:#6B7383;
  --acc:#8B8BF0;--acc-s:#23244A;--acc-t:#B1B1FF;--on:#101223;
  --g:#3CC795;--g-s:#12302A;--r:#F07A72;--r-s:#3A1C1B;--a:#E7B04A;--a-s:#3A2E12;--gr-s:#22262F;
  --sh:0 10px 30px rgba(0,0,0,.45);
}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
svg{flex:none}
.mut{color:var(--mut)} .faint{color:var(--faint)} .grow{flex:1}
.row{display:flex;align-items:center;gap:8px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
#app{height:100vh;display:flex}

/* ---------- 左侧竖栏 ---------- */
.rail{width:var(--rw);flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:16px 0 18px;gap:6px;z-index:2}
.logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#7A7AF0,#4B4BC8);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800}
.rail .logo{width:38px;height:38px;border-radius:12px;font-size:19px;margin-bottom:18px;box-shadow:0 6px 16px rgba(91,91,214,.35)}
.tab{position:relative;width:58px;height:58px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mut);font-size:12px;font-weight:500;transition:.15s}
.tab:hover{background:var(--gr-s);color:var(--text)}
.tab.on{background:var(--acc-s);color:var(--acc-t)}
.tab.on::before{content:"";position:absolute;left:-9px;top:17px;bottom:17px;width:3px;border-radius:0 3px 3px 0;background:var(--acc)}
.tab .dot{position:absolute;top:9px;right:12px;width:9px;height:9px;border-radius:50%;background:var(--r);border:2px solid var(--panel)}
.rsep{width:34px;height:1px;background:var(--line);margin:8px 0}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--acc-s);color:var(--acc-t);display:grid;place-items:center;font-weight:600;font-size:13px}
.icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--mut);flex:none}
.icon:hover{background:var(--gr-s);color:var(--text)}

/* ---------- 页面 ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.page{flex:1;overflow:auto}
.pc{max-width:980px;margin:0 auto;padding:0 32px 110px}
#app.dopen .swr .chip{display:none}
#app.dopen .pc{max-width:none;margin:0;width:calc(100vw - var(--rw) - var(--dw));padding:0 24px 110px}
.ph{padding:30px 0 18px}
.ph h1{font-size:24px;letter-spacing:.2px;margin-bottom:2px}
.pt{display:flex;align-items:flex-start;gap:16px}
.swr{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.lsw{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 12px 0 14px;border-radius:11px;border:1px solid var(--line);background:var(--panel);font-weight:600}
.lsw:hover{border-color:var(--faint)}
.pm{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}
.pm .bar{width:120px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;background:var(--gr-s);font-size:12.5px;color:var(--mut)}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--gr-s)}
.seg button{height:28px;padding:0 14px;border-radius:7px;font-size:13px;color:var(--mut);font-weight:500}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(16,24,40,.12)}
.hint{font-size:12px;color:var(--mut);display:flex;gap:6px;align-items:flex-start;line-height:1.45}
.bar{height:6px;border-radius:3px;background:var(--gr-s);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7A7AF0,var(--acc));border-radius:3px;transition:width .4s}
.gh{padding:16px 4px 8px;font-size:12px;color:var(--faint);font-weight:600;display:flex;gap:6px;align-items:center}
.gh span{background:var(--gr-s);border-radius:9px;padding:0 7px;font-weight:500;color:var(--mut)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:13.5px;font-weight:500;transition:.12s;white-space:nowrap}
.btn:hover{background:var(--panel2);border-color:var(--faint)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.lg{height:38px;padding:0 18px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--on)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.good{background:var(--g);border-color:var(--g);color:#fff}
.btn.good:hover{filter:brightness(1.06)}
.btn.danger{color:var(--r);border-color:color-mix(in srgb,var(--r) 35%,var(--line))}
.btn.danger:hover{background:var(--r-s)}
.btn.ghost{border-color:transparent;background:none;color:var(--mut)}
.btn.ghost:hover{background:var(--gr-s);color:var(--text)}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- 缺陷行 ---------- */
.dr{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);margin-bottom:8px;cursor:pointer;transition:background .15s,border-color .15s;max-height:96px;overflow:hidden}
.dr:hover{border-color:var(--faint)}
.dr.sel{background:var(--acc-s);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
.dr.leaving{animation:leave .45s ease forwards;pointer-events:none}
@keyframes leave{
  0%{opacity:1;max-height:96px;margin-bottom:8px}
  50%{opacity:0;transform:translateX(-28px);max-height:96px;margin-bottom:8px}
  100%{opacity:0;transform:translateX(-28px);max-height:0;margin-bottom:0;padding-top:0;padding-bottom:0;border-width:0}}
.ib{min-width:0;flex:1}
.rt{display:flex;align-items:center;gap:8px;flex:none}
.r1{display:flex;align-items:center;gap:8px;font-size:12px}
.id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--mut)}
.tt{font-weight:600;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.mt{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sti{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none}
.sti.review{border:2px solid var(--acc);background:var(--acc-s)}
.sti.review::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc)}
.sti.queued,.sti.passed{color:var(--faint)}
.sti.accepted{background:var(--g-s);color:var(--g)}
.sti.rejected{background:var(--r-s);color:var(--r)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--acc-s);border-top-color:var(--acc);animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.pri{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--mut)}
.pri i{width:7px;height:7px;border-radius:50%}
.tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:600;white-space:nowrap}
.tag.acc{background:var(--acc);color:var(--on)}
.tag.amb{background:var(--a-s);color:var(--a)}
.tag.g{background:var(--g-s);color:var(--g)}
.tag.r{background:var(--r-s);color:var(--r)}
.tag.gr{background:var(--gr-s);color:var(--mut)}
.tag.sa{background:var(--acc-s);color:var(--acc-t)}
.tag.ln{background:var(--panel);border:1px solid var(--line);color:var(--mut);font-weight:500;max-width:120px;overflow:hidden;text-overflow:ellipsis;display:inline-block;line-height:18px}

/* banner / empty */
.bn{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:12px;background:var(--a-s);margin-bottom:18px;border:1px solid color-mix(in srgb,var(--a) 25%,transparent)}
 .bn b{display:block} .bn span{font-size:12.5px;color:var(--mut)}
.empty{margin:auto;text-align:center;color:var(--mut);max-width:380px}
.empty .big{width:64px;height:64px;border-radius:20px;background:var(--acc-s);color:var(--acc);display:grid;place-items:center;margin:0 auto 16px}
.empty h2{color:var(--text);margin-bottom:6px;font-size:17px}

/* ---------- 清单卡片 ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.lc{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;transition:.15s}
.lc:hover{box-shadow:var(--sh)}
.lc.cur{border-color:color-mix(in srgb,var(--acc) 50%,transparent);box-shadow:0 0 0 3px var(--acc-s)}
.lct{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:650;min-width:0}
.lct b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:650}
.dist{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--gr-s);gap:2px}
.dist i{display:block;height:100%}
.leg{display:flex;gap:12px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.leg i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
.lcf{display:flex;align-items:center;gap:6px;margin-top:4px;padding-top:12px;border-top:1px solid var(--line)}
.lcnew{border:1.5px dashed var(--line);background:none;align-items:center;justify-content:center;color:var(--mut);cursor:pointer;min-height:176px;font-weight:500}
.lcnew:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-s);box-shadow:none}

/* ---------- 搜索 ---------- */
.sbar{display:flex;gap:10px;margin-bottom:10px}
.sin{flex:1;display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--faint)}
.sin:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-s)}
.sin input{flex:1;border:0;outline:0;background:none;font:inherit;color:var(--text)}
.cnt{font-size:12.5px;color:var(--mut);margin:14px 4px 10px}

/* ---------- 侧栏(详情 / 编辑清单) ---------- */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(15,17,24,.16);animation:fi .2s;transition:opacity .2s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:var(--dw);background:var(--panel);box-shadow:-14px 0 44px rgba(16,24,40,.16);z-index:21;display:flex;flex-direction:column;animation:slide .26s cubic-bezier(.2,.8,.2,1);border-left:1px solid var(--line)}
.drawer.out{animation:slideout .2s ease forwards}
@keyframes slide{from{transform:translateX(48px);opacity:0}}
@keyframes slideout{to{transform:translateX(48px);opacity:0}}
@keyframes fi{from{opacity:0}}
.dtop{display:flex;align-items:center;gap:10px;padding:13px 20px;border-bottom:1px solid var(--line);flex:none}
.dscroll{flex:1;overflow:auto;padding:22px 24px 30px}
.dwrap{display:flex;flex-direction:column;gap:14px}
.dtitle{font-size:21px;line-height:1.4;font-weight:650;letter-spacing:.2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags2{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.mrs{display:flex;flex-direction:column;gap:9px;padding:13px 15px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.mr{display:flex;gap:14px;font-size:13px;align-items:flex-start}
.mr label{width:58px;flex:none;color:var(--faint);font-size:12px;padding-top:1px}
.mr span{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5}
.lbox{display:flex;align-items:center;gap:12px;padding:12px 15px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.lbox.none{background:var(--a-s);border-color:color-mix(in srgb,var(--a) 28%,transparent)}
.lbox .lt{flex:1;min-width:0}
.lbox .lt b{display:block;font-size:13px}
.lbox .lt span{font-size:12px;color:var(--mut)}
.lbox.none>svg{color:var(--a)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.act{flex:none;border-top:1px solid var(--line);background:var(--panel);padding:14px 24px}
.actin{display:flex;align-items:center;gap:10px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card.warn{background:var(--a-s);border-color:color-mix(in srgb,var(--a) 30%,transparent)}
.card.info{background:var(--acc-s);border-color:color-mix(in srgb,var(--acc) 25%,transparent)}
.ct{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:8px}
.ct .sub{margin-left:auto;font-weight:400;font-size:12px;color:var(--faint)}
.card p{opacity:.9}
.card ul{padding-left:18px;display:flex;flex-direction:column;gap:4px}
.concl{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px dashed var(--line);font-size:13px;color:var(--mut)}
.concl b{color:var(--text)}
.steps{display:flex}
.stp{flex:1;display:flex;flex-direction:column;gap:6px;position:relative;font-size:12.5px;color:var(--faint)}
.stp .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--gr-s);color:var(--faint);font-size:11px;font-weight:700;position:relative;z-index:1}
.stp::before{content:"";position:absolute;top:10px;left:22px;right:0;height:2px;background:var(--gr-s)}
.stp:last-child::before{display:none}
.stp.done{color:var(--mut)} .stp.done .n{background:var(--g);color:#fff} .stp.done::before{background:var(--g)}
.stp.cur{color:var(--text);font-weight:600} .stp.cur .n{background:var(--acc);color:var(--on)}
.gitline{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.file{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:10px}
.fh{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel2);cursor:pointer;font-size:12.5px}
.fh .chev{transition:.15s;color:var(--faint)} .file.open .chev{transform:rotate(90deg)}
.fh .add{color:var(--g)} .fh .del{color:var(--r)}
.diff{display:none;font:12px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;overflow:auto}
.file.open .diff{display:block}
.diff div{padding:0 12px;white-space:pre}
.diff .p{background:var(--g-s);color:var(--g)} .diff .m{background:var(--r-s);color:var(--r)} .diff .c{color:var(--faint)}
.sk{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--gr-s),var(--panel2),var(--gr-s));background-size:200% 100%;animation:sh 1.4s infinite;margin:8px 0}
@keyframes sh{to{background-position:-200% 0}}
.res{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.cmt{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:13px}
.tl{list-style:none;padding:0!important;gap:8px!important}
.tl li{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut)}
.tl li svg{color:var(--g)}
.note{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:12.5px;color:var(--mut)}

/* 编辑清单 */
.dhd{display:flex;align-items:center;gap:10px;padding:15px 22px;border-bottom:1px solid var(--line);flex:none}
.dhd h2{font-size:17px}
.en{padding:18px 22px 14px;flex:none}
.en label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:7px}
.ef{padding:12px 22px 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);flex:none;display:flex;flex-direction:column;gap:11px;background:var(--panel2)}
.fr{display:flex;align-items:center;gap:10px}
.fl{width:48px;font-size:12px;color:var(--mut);font-weight:600;flex:none}
.acw{position:relative;flex:1;min-width:0}
.acw .acl{position:absolute;left:0;right:0;top:100%;z-index:6;box-shadow:var(--sh)}
.etool{display:flex;align-items:center;gap:8px;padding:11px 22px;flex:none;border-bottom:1px solid var(--line);font-size:13px}
.escroll{flex:1;overflow:auto;padding:8px 14px}
.er{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;cursor:pointer}
.er:hover{background:var(--panel2)} .er.on{background:var(--acc-s)}
.cb{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--faint);display:grid;place-items:center;color:transparent;flex:none;transition:.12s}
.cb.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.foot{flex:none;padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;background:var(--panel)}
.inp,.ta{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:0 11px;height:36px;font:inherit;color:var(--text);outline:none}
.ta{height:84px;padding:9px 11px;resize:none}
.inp:focus,.ta:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-s)}
.inp.err{border-color:var(--r);box-shadow:0 0 0 3px var(--r-s);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.ferr{color:var(--r);font-size:12px;margin-top:6px;min-height:0}
.cp{height:28px;padding:0 11px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;color:var(--mut);display:inline-flex;align-items:center;gap:6px}
.cp:hover{border-color:var(--faint)}
.cp.on{background:var(--acc-s);border-color:var(--acc);color:var(--acc-t);font-weight:500}
.acl{margin-top:4px;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.acl button{display:block;width:100%;text-align:left;padding:7px 11px;font-size:13px}
.acl button:hover{background:var(--acc-s)}
.tok{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 6px 0 10px;border-radius:14px;background:var(--acc-s);color:var(--acc-t);font-size:12.5px;max-width:100%}
.tok span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tok button{width:18px;height:18px;border-radius:9px;display:grid;place-items:center;opacity:.7;flex:none}
.tok button:hover{opacity:1;background:rgba(91,91,214,.18)}
.sw{width:38px;height:22px;border-radius:11px;background:var(--line);position:relative;transition:.15s;flex:none;cursor:pointer}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--acc)} .sw.on::after{left:18px}

/* ---------- 浮层 ---------- */
#pop{position:fixed;z-index:30}
.pop{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
.pop h5{padding:11px 14px 8px;font-size:12px;color:var(--faint);font-weight:600}
.lpi{display:flex;align-items:center;gap:10px;width:calc(100% - 12px);margin:0 6px 4px;padding:9px 10px;border-radius:9px;text-align:left}
.lpi:hover{background:var(--acc-s)}
.lpi div{flex:1;min-width:0} .lpi b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lpi span{font-size:12px;color:var(--mut)}
.lpi svg{color:var(--faint)} .lpi.on svg{color:var(--acc)}
.mask{position:fixed;inset:0;background:rgba(10,12,18,.45);backdrop-filter:blur(3px);z-index:40;display:grid;place-items:center;animation:fi .15s}

function actBtn(l,sm){

function item(d,idx,cur,l){
  const ghost=GH.has(d.id)&&!l.ids.includes(d.id);
  const extra=d.state==='analyzing'?` · ${STEPS[Math.min(d.step,2)]}…`:d.state==='paused'?` · 暂停于「${STEPS[d.step]}」`:'';
  const rb=d.state==='analyzing'?`<button class="icon sm" title="暂停修复" onclick="event.stopPropagation();pauseDefect('${d.id}')">${ic('pause',14)}</button>`
    :d.state==='paused'&&listsOf(d.id).length?`<button class="icon sm" title="继续修复" onclick="event.stopPropagation();resumeDefect('${d.id}')">${ic('play',13)}</button>`:'';
  return `<div class="dr ${selId===d.id?'sel':''} ${ghost?'ghost':''}" data-id="${d.id}" onclick="openDetail('${d.id}')">

   <div class="ib"><div class="r1"><span class="id">${d.id}</span>${priDot(d.pri)}${cur?'<span class="tag acc">当前</span>':''}${d.state==='review'&&d.stale?'<span class="tag amb">待复核</span>':''}${ghost?'<span class="tag gr">已移出清单</span>':''}</div>
   <div class="tt">${esc(d.title)}</div><div class="mt">${d.type} · ${esc(d.req)}${extra}</div></div>
   <div class="rt">${rb}${badge(d)}</div></div>`;

function workHTML(){
  const head=`<div class="ph"><div class="pt"><div><h1>处理</h1><div class="mut">AI 会按顺序逐个修复清单里的缺陷,你只需要审核结果</div></div><div class="grow"></div>
    <span class="chip">${ic('folder',14)} mbo-android ${ic('branch',14)} main</span></div></div>`;
  const l=LS(viewList)||activeList()||LISTS[0];
  if(!l)return `<div class="pc">${head}${emptyBlock('layers','还没有清单','先创建一个清单,把要处理的缺陷放进去。',`<button class="btn primary lg" onclick="go('lists')">去创建清单</button>`)}</div>`;
  viewList=l.id;
  const order=[...l.ids];
  [...GH.entries()].sort((a,b)=>a[1]-b[1]).forEach(([id,i])=>{if(!order.includes(id))order.splice(Math.min(i,order.length),0,id)});

  const aiDone=mine.filter(d=>!UNDONE.includes(d.state)).length, rv=mine.filter(d=>d.state==='review'), cur=firstReview(l);

  else if(l.run==='idle')bn=`<div class="bn info">${ic('info',18)}<div class="grow"><b>这个清单还没开始处理</b><span>开始后,AI 会按下面的顺序逐个修复,不需要你守着。</span></div>${actBtn(l,1)}</div>`;
  else if(l.run==='done')bn=`<div class="bn ok">${ic('check',18)}<div class="grow"><b>AI 已处理完这个清单</b><span>${rv.length?`还有 ${rv.length} 个缺陷等你审核。`:'清单中的缺陷都已处理完毕。'}</span></div></div>`;
  return `<div class="pc">${head}
   <div class="swr"><button class="lsw" onclick="openCurPop(event)">${ic('list',16)}<span>${esc(l.name)}</span><span class="tag gr">${l.ids.length} 条</span>${ic('chevd',14)}</button>${lbadge(l)}

   ${L.length?'':emptyBlock('layers','这个清单还是空的','去「清单」页编辑它,或在缺陷详情里把缺陷加进来。',`<button class="btn" onclick="openEditor('${l.id}')">编辑清单</button>`)}</div>`;

function searchHTML(){
  return `<div class="pc"><div class="ph"><h1>搜索</h1><div class="mut">按标题模糊搜索全部缺陷,不限于清单</div></div>
   <div class="sbar"><div class="sin">${ic('search',18)}<input id="sq" placeholder="输入缺陷标题的关键词,例如「登录」" value="${esc(S.q)}" oninput="S.q=this.value" onkeydown="if(event.key==='Enter')doSearch()"></div><button class="btn primary lg" onclick="doSearch()">搜索</button></div>
   <div id="sres">${searchRes()}</div></div>`;
}
const fuzzy=(q,s)=>{q=q.toLowerCase().replace(/\s/g,'');s=s.toLowerCase().replace(/\s/g,'');let i=0;for(const c of s){if(c===q[i])i++}return i===q.length};
function doSearch(){
  const q=($('#sq')?.value||S.q).trim();S.q=q;
  S.done=!!q;
  const sub=D.filter(d=>d.title.toLowerCase().includes(q.toLowerCase()));
  const loose=D.filter(d=>!sub.includes(d)&&fuzzy(q,d.title));
  S.ids=q?[...sub,...loose].map(d=>d.id):[];
  renderSearchRes();
}
function searchRes(){
  if(!S.done)return emptyBlock('search','搜索任意缺陷','输入标题关键词,找到后点开即可查看详情,或把它加入清单。');
  if(!S.ids.length)return emptyBlock('search','没有找到相关缺陷',`没有标题匹配「${esc(S.q)}」的缺陷,换个关键词试试。`);
  return `<div class="cnt">找到 ${S.ids.length} 个匹配「${esc(S.q)}」的缺陷</div>`+S.ids.map(id=>{
    const d=get(id);
    return `<div class="dr ${selId===d.id?'sel':''}" onclick="openDetail('${d.id}')"><div class="sti ${d.state}">${stIcon(d.state)}</div>
     <div class="ib"><div class="r1"><span class="id">${d.id}</span>${priDot(d.pri)}</div><div class="tt">${esc(d.title)}</div><div class="mt">${d.type} · ${esc(d.req)}</div></div>
     <div class="rt">${listChips(d.id)}${badge(d)}</div></div>`}).join('');
}

  $('#app').classList.toggle('dopen',kind==='detail');

function fillDrawer(){
  const a=$('#drawer aside');if(!a||!DR)return;

function sigOf(id){
  const d=get(id);if(!d)return '';const a=activeList();
  return [d.state,d.step,d.stale,!!rechecking[id],d.fix?.commit,listsOf(id).map(l=>l.id+l.run).join(),a?.id,
    a?a.ids.map(get).filter(x=>x&&UNDONE.includes(x.state)).length:'',D.filter(x=>x.state==='review').length,viewList].join('|');
}
let closing=false;
function closeDrawer(){
  const a=$('#drawer aside');if(!a||closing)return;closing=true;closePop();
  a.classList.add('out');const sc=$('#drawer .scrim');if(sc)sc.style.opacity=0;
  setTimeout(()=>{
    $('#drawer').innerHTML='';$('#app').classList.remove('dopen');DR=null;E=null;selId=null;closing=false;
    if(view==='work'&&GH.size){
      renderPage();

function partial(d){
  const n=[];
  if(d.step>=1)n.push(`判断完成:可通过修改代码解决,置信度 ${86+d.id.charCodeAt(6)%10}%`);
  else n.push('正在分析缺陷描述,还没有得出结论');
  if(d.step>=2){n.push(`已基于 main 创建临时分支 <span class="mono">fixmate/${d.id}</span>`);n.push(d.note||'已定位到相关代码,已完成的修改保存在临时分支上')}
  return n;
}
function detailParts(d){
  const top=`<div><h1 class="dtitle" title="${esc(d.title)}">${esc(d.title)}</h1>
   <div class="tags2"><span class="tag gr">${d.type}</span><span class="tag gr">报告人 ${d.who}</span><span class="tag gr">${d.time}</span></div></div>
   <div class="mrs"><div class="mr"><label>关联需求</label><span title="${esc(d.req)}">${esc(d.req)}</span></div><div class="mr"><label>规划版本</label><span title="${esc(d.ver)}">${esc(d.ver)}</span></div></div>
   ${listBox(d)}
   <div class="card"><div class="ct">${ic('chat',16)}缺陷描述<span class="sub">来自飞书</span></div><p>${esc(d.desc)}</p></div>`;
  const bar=(hint,btns)=>`<div class="act"><div class="actin"><span class="hint grow">${hint}</span>${btns}</div></div>`;
  let body='',act='';
  if(d.state==='review'){
    const stale=d.stale;
    body=(stale?`<div class="card info"><div class="ct">${ic('refresh',16)}此方案需要复核<span class="sub">生成于 ${d.cached.time} · 基线 ${d.cached.base}</span></div>
        <p>该方案生成于你审核其它缺陷期间,基于较早的代码。接受前,AI 会结合<b>最新 main</b> 与下方<b>缓存结论</b>重新评估,避免与已合入的修改冲突。</p>
        <div class="concl"><b>缓存结论</b>:${d.cached.text}</div>
        <div style="margin-top:12px"><button class="btn primary sm" onclick="recheck('${d.id}')" ${rechecking[d.id]?'disabled':''}>${rechecking[d.id]?'<span class="spin"></span>正在复核…':ic('refresh',14)+'立即复核'}</button></div></div>`:'')+fixCards(d);
    act=bar(stale?'请先完成复核,再接受该方案':'接受后将 cherry-pick 到 main、push 并通过 Jenkins 打 OTA',
      `<button class="btn" onclick="openPass('${d.id}')">${ic('skip',14)}跳过</button>
       <button class="btn danger" onclick="openReject('${d.id}')">${ic('x',14)}拒绝</button>
       <button class="btn good lg" onclick="openAccept('${d.id}')" ${stale?'disabled':''}>${ic('check',16)}接受并发布</button>`);
  }else if(d.state==='analyzing'){
    body=stepper(Math.min(d.step,2))+`<div class="card"><div class="ct"><div class="spin"></div>AI 正在处理<span class="sub">${STEPS[Math.min(d.step,2)]}…</span></div><div class="sk" style="width:90%"></div><div class="sk" style="width:72%"></div><div class="sk" style="width:81%"></div></div>`;
    act=bar('暂停后会保存当前进度,之后可以从这里接着处理',`<button class="btn" onclick="pauseDefect('${d.id}')">${ic('pause',14)}暂停修复</button>`);
  }else if(d.state==='paused'){
    const ls=listsOf(d.id);
    body=stepper(d.step,true)+`<div class="card warn"><div class="ct">${ic('pause',16)}已保存的中间结果<span class="sub">暂停于 ${d.pausedAt||'--'}</span></div><ul>${partial(d).map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
    act=bar(ls.length?`继续后从「${STEPS[d.step]}」接着处理,不会重复已完成的步骤`:'它不在任何清单中,先加入清单才能继续',
      `<button class="btn primary" ${ls.length?'':'disabled'} onclick="resumeDefect('${d.id}')">${ic('play',14)}继续修复</button>`);
  }else if(d.state==='queued'){
    const a=activeList();
    if(a&&a.ids.includes(d.id)){
      const ahead=a.ids.slice(0,a.ids.indexOf(d.id)).map(get).filter(x=>x&&UNDONE.includes(x.state)).length;
      body=`<div class="card"><div class="ct">${ic('clock',16)}排队中</div><p>「${esc(a.name)}」正在按顺序处理,前面还有 ${ahead} 个缺陷,轮到它时会自动开始。</p></div>`;
    }else{
      const ls=listsOf(d.id);
      if(ls.length){
        const l=ls.find(x=>x.run==='paused')||ls[0],verb=l.run==='idle'?'开始处理':'继续处理';
        body=`<div class="card"><div class="ct">${ic('clock',16)}未开始</div><p>所在清单「${esc(l.name)}」${l.run==='idle'?'还没开始处理':'目前没有在处理'}。</p></div>`;
        act=bar('开始后,AI 会按清单顺序逐个修复',`<button class="btn primary" onclick="startList('${l.id}')">${ic('play',14)}${verb}「${esc(l.name)}」</button>`);
      }else body=`<div class="card"><div class="ct">${ic('clock',16)}未开始</div><p>它还不在任何清单中。加入清单并开始处理后,AI 才会修复它。</p></div>`;
    }
  }else if(d.state==='passed'){
    body=`<div class="card"><div class="ct">${ic('skip',16)}已跳过${d.auto?'<span class="tag sa">AI 自动判断</span>':''}</div><p>${esc(d.reason)}</p></div>`;
  }else if(d.state==='rejected'){
    body=`<div class="card"><div class="ct">${ic('x',16)}已拒绝该方案</div><p>${d.reason?esc(d.reason):'未填写原因'}</p>
      <div class="res"><span class="tag ${d.kept?'g':'gr'}">${d.kept?'已保留 AI 修改':'已丢弃 AI 修改'}</span></div>
      ${d.kept?`<div class="note">修改已通过 <span class="mono">git cherry-pick -n</span> 放入 main 的工作区(未提交),临时分支已删除。</div>`:''}</div>`;
  }else if(d.state==='accepted'){
    body=`<div class="card"><div class="ct">${ic('check',16)}已接受并发布<span class="sub">${d.commit?'commit '+d.commit:''}</span></div>
      <ul class="tl">${['已 cherry-pick 到 main 并 push','已删除本地临时分支','Jenkins 已打包 OTA','飞书缺陷已标记为已解决'].map(t=>`<li>${ic('check',14)}${t}</li>`).join('')}</ul>
      <div class="res"><span class="tag g">OTA ${d.ota}</span></div>
      <div class="cmt"><span class="faint">已在飞书评论:</span> <span class="mono">#${d.ota}</span></div></div>`;
  }
  if(FINAL.includes(d.state)){
    const vl=LS(viewList),l=vl&&vl.ids.includes(d.id)?vl:listsOf(d.id)[0],nx=firstReview(l,d.id);
    if(nx){const n=l.ids.map(get).filter(x=>x&&x.state==='review'&&x.id!==d.id).length;
      act=bar(`「${esc(l.name)}」还有 ${n} 个待审核的缺陷`,`<button class="btn primary" onclick="openDetail('${nx.id}')">下一个待审核${ic('chev',15)}</button>`)}
  }
  return {body:top+body,act};
}

function eSave(){

/* ========== 浮层 / 通知 ========== */
function closePop(){$('#pop').innerHTML=''}
document.addEventListener('click',e=>{if(!e.target.closest('#pop'))closePop()});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($('#modal').innerHTML)closeModal();else if($('#pop').innerHTML)closePop();else closeDrawer()});
function notify(title,body,kind,id,quiet){
  const col={new:['--acc-s','--acc','bell'],ok:['--g-s','--g','check'],skip:['--gr-s','--mut','skip'],done:['--g-s','--g','party'],warn:['--a-s','--a','alert']}[kind]||['--acc-s','--acc','bell'];
  if(!quiet){notifs.unshift({title,body,kind,id,unread:true,time:nowS()});renderRail()}

function toggleBell(e){

   ${notifs.length?notifs.slice(0,8).map(n=>`<div class="bi" onclick="closePop();${n.id?`openDetail('${n.id}')`:''}">${n.unread?'<i class="u"></i>':'<i style="width:7px;flex:none"></i>'}<div><b>${esc(n.title)}</b><span class="mut">${esc(n.body)}</span><small>${n.time}</small></div></div>`).join(''):'<div class="faint" style="padding:24px;text-align:center">暂无通知</div>'}</div>`;
  notifs.forEach(n=>n.unread=false);renderRail();
}


/* ========== 调度:清单状态机 ========== */
function startList(id){            // 开始或继续一个清单
  const l=LS(id),a=activeList();
  if(a&&a!==l){pauseList(a.id,true);notify(`已暂停「${a.name}」`,'同一时间只处理一个清单,进度已保存','skip',null,true)}
  const was=l.run;l.run='running';
  if(was!=='running')notify(`${was==='idle'?'开始':'继续'}处理「${l.name}」`,'AI 会按顺序逐个修复','new',null,true);
  tick();
}
function pauseList(id,silent){
  const l=LS(id);l.run='paused';
  l.ids.map(get).forEach(d=>{if(d&&d.state==='analyzing'){d.state='paused';d.pausedAt=nowS()}});
  if(!silent){notify(`已暂停「${l.name}」`,'进度已保存,继续时从暂停处接着处理','skip',null,true);refresh()}
}
function pauseDefect(id){
  const l=LISTS.find(x=>x.run==='running'&&x.ids.includes(id));
  if(l)pauseList(l.id);else{const d=get(id);d.state='paused';d.pausedAt=nowS();refresh()}
}
function resumeDefect(id){
  const ls=listsOf(id),l=ls.find(x=>x.run==='paused')||ls.find(x=>x.run==='running')||ls[0];
  if(l)startList(l.id);
}
function tick(){
  D.forEach(d=>{if(d.state==='analyzing'&&!inActive(d)){d.state='paused';d.pausedAt=nowS()}});
  const a=activeList();
  if(a){
    const ds=a.ids.map(get).filter(Boolean);
    if(!ds.some(d=>d.state==='analyzing')){
      const nx=ds.find(d=>d.state==='queued'||d.state==='paused');   // 第一个未处理完的缺陷
      if(nx){if(nx.state==='queued')nx.step=0;nx.state='analyzing'}   // 已暂停的沿用保存的 step
      else{
        a.run='done';const n=ds.filter(d=>d.state==='review').length;
        notify(`「${a.name}」处理完成`,n?`还有 ${n} 个缺陷等你审核`:'清单中的缺陷都已处理完毕','done');
      }
    }
  }
  refresh();
}
setInterval(()=>{
  let changed=false;
  D.filter(d=>d.state==='analyzing').forEach(d=>{
    d.step++;changed=true;
    if(!d.fixable&&d.step>=1){d.state='passed';d.auto=true;d.reason='AI 判断:这是一条产品体验类建议,没有确定的代码修改目标,已自动跳过。如需处理请手动调整。';notify(`AI 已跳过 ${d.id}`,'不是可通过改代码解决的确定问题','skip',d.id)}
    else if(d.step>=3){
      d.state='review';
      d.stale=listsOf(d.id).some(l=>l.ids.some(x=>x!==d.id&&get(x)?.state==='review'));
      d.fix=d.fix||{conf:85+Math.floor(Math.random()*10),branch:'fixmate/'+d.id,commit:Math.random().toString(16).slice(2,9),judge:'问题描述明确,可通过修改代码解决。',summary:['定位到相关模块并修复','补充必要的测试'],conclusion:'已分析根因并完成修复,详见 diff。',files:[{name:'src/modules/'+d.req.replace(/\s/g,'').slice(0,8)+'/index.ts',add:8,del:3,lines:[['c','@@ -20,6 +20,11 @@'],['m','-   return legacy(x)'],['p','+   return safe(x)']]}],conflicts:[]};
      if(d.stale)d.cached={time:nowS(),base:'a3f9c21',text:d.fix.conclusion};
      notify(`方案已就绪 · ${d.id}`,d.title,'new',d.id);
    }
  });
  if(changed)tick();
},1600);
function recheck(id){
  rechecking[id]=true;fillDrawer();
  setTimeout(()=>{
    const d=get(id);d.stale=false;rechecking[id]=false;
    d.fix.recheck='已结合最新 main(含已合入的相关修改)与缓存结论重新评估:原方案调整为复用已有的校验函数,冲突已消除。';
    d.fix.conflicts=[];d.fix.commit=Math.random().toString(16).slice(2,9);
    notify('复核完成',`${id} 的方案已基于最新代码更新`,'ok',id);refresh();fillDrawer();
  },1800);
}
function simNew(){
  const t=NEWPOOL[newN++%NEWPOOL.length];
  const d={...t,id:(t.type==='建议'?'SUG-':'BUG-')+(2490+newN),who:'飞书同学',time:'刚刚',state:'queued',desc:'(模拟的新缺陷)'+t.title+'。'};
  D.unshift(d);
  notify('收到新缺陷 · 尚未加入清单',`${d.id} · ${d.pri} · ${d.title}`,'warn',d.id);
  if(view==='onboard')view='work';
  render();
}

/* ========== 弹窗:接受 / 拒绝 / 跳过 ========== */
function modal(html){$('#modal').innerHTML=`<div class="mask" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()">${html}</div></div>`}
function closeModal(){$('#modal').innerHTML=''}
function finish(d){closeModal();tick();fillDrawer()}
let keep=true;
function openReject(id){
  keep=true;
  modal(`<h3>拒绝 ${id} 的修复方案</h3><div class="sub">被拒绝的方案仍可能有价值,你可以选择是否保留。</div>
   <div id="rc"></div>
   <label class="mut" style="font-size:12.5px;display:block;margin:6px 0">拒绝原因(可选)</label><textarea class="ta" id="rr" placeholder="例如:思路对,但改动范围偏大"></textarea>
   <footer><button class="btn" onclick="closeModal()">取消</button><button class="btn danger" onclick="doReject('${id}')">确认拒绝</button></footer>`);
  rcRender();
}
function rcRender(){
  $('#rc').innerHTML=`<button class="rc ${keep?'on':''}" onclick="keep=true;rcRender()"><div class="rd"></div><div><b>保留 AI 的修改</b><span>用 <span class="mono">git cherry-pick -n</span> 放入 main 工作区(不提交),方便你在此基础上继续改</span></div></button>
   <button class="rc ${keep?'':'on'}" onclick="keep=false;rcRender()"><div class="rd"></div><div><b>丢弃修改</b><span>仅删除临时分支,不改动 main</span></div></button>`;
}
function doReject(id){const d=get(id);d.state='rejected';d.kept=keep;d.reason=$('#rr').value.trim();notify(`已拒绝 ${id}`,keep?'AI 修改已保留到工作区':'AI 修改已丢弃','skip');finish(d)}
const PASSR=['需求不明确','无法复现','不是代码问题','稍后处理'];
function openPass(id){
  modal(`<h3>跳过 ${id}</h3><div class="sub">跳过后不会修改任何代码,请简单备注原因。</div>
   <div class="chips" style="margin-bottom:10px">${PASSR.map(r=>`<button class="cp" onclick="$('#pr').value='${r}';$('#pb').disabled=false">${r}</button>`).join('')}</div>
   <textarea class="ta" id="pr" placeholder="跳过原因(必填)" oninput="$('#pb').disabled=!this.value.trim()"></textarea>
   <footer><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" id="pb" disabled onclick="doPass('${id}')">确认跳过</button></footer>`);
}
function doPass(id){const d=get(id);d.state='passed';d.auto=false;d.reason=$('#pr').value.trim();notify(`已跳过 ${id}`,d.reason,'skip');finish(d)}
const ASTEPS=d=>['切换到主分支 <code>main</code>',`cherry-pick <code>${d.fix.branch}</code> 上的提交`,'删除本地临时分支','push 到 <code>origin/main</code>','调用 Jenkins 打 OTA 包','在飞书将缺陷标记为「已解决」','在飞书评论中备注版本号 <code>#{ota_version}</code>'];
function openAccept(id){
  const d=get(id);
  modal(`<h3>接受 ${id} 的修复方案</h3><div class="sub">确认后将自动完成以下步骤,无需手动操作。</div>
   <ul class="ostep">${ASTEPS(d).map((s,i)=>`<li><span class="b">${i+1}</span><span>${s}</span></li>`).join('')}</ul>
   <div class="note">评论格式:<span class="mono">#{ota_version}</span>,例如 <span class="mono">#3.8.0.2417</span></div>
   <footer><button class="btn" onclick="closeModal()">取消</button><button class="btn good" onclick="runAccept('${id}')">${ic('check',15)}确认接受</button></footer>`);
}
function runAccept(id){
  const d=get(id),ota='3.8.0.'+(2400+Math.floor(Math.random()*90)),S2=ASTEPS(d);
  S2[4]='Jenkins 打 OTA 包(预计约 1 分钟)';
  const paint=n=>{
    const box=$('#modal .modal');if(!box)return;
    box.innerHTML=`<h3>${n>=7?'已接受并发布':'正在处理 '+id}</h3><div class="sub">${n>=7?'缺陷已标记为 accepted。':'请稍候,期间可以关闭窗口,过程在后台继续。'}</div>
     <ul class="ostep">${S2.map((s,i)=>{
       const st=i<n?'ok':i===n?'run':'';
       const txt=i===4&&i<n?`OTA 已完成,版本号 <code>${ota}</code>`:i===6&&i<n?`已评论 <code>#${ota}</code>`:s;
       return `<li class="${st}"><span class="b">${i<n?ic('check',12):i===n?'<div class="spin"></div>':i+1}</span><span>${txt}</span></li>`}).join('')}</ul>
     <footer>${n>=7?`<button class="btn primary" onclick="closeModal()">完成</button>`:`<button class="btn" onclick="closeModal()">转到后台</button>`}</footer>`;
  };
  let n=0;paint(0);
  const next=()=>{
    n++;paint(n);
    if(n===7){d.state='accepted';d.ota=ota;d.commit=d.fix.commit;notify(`已接受 ${id}`,`OTA ${ota} 已打包,飞书已评论 #${ota}`,'ok',id);tick();fillDrawer()}
    else setTimeout(next,n===4?1800:650);
  };
  setTimeout(next,650);
}

render();
tick();
</script>
