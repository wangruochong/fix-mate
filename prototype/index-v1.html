<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FixMate · 界面原型</title>
<style>
:root{
  --bg:#F5F6F8;--panel:#fff;--panel2:#FAFAFC;--line:#E6E8EC;--text:#171A21;--mut:#667085;--faint:#98A2B3;
  --acc:#5B5BD6;--acc-s:#EEEEFC;--acc-t:#4646C0;--on:#fff;
  --g:#18946A;--g-s:#E5F5EE;--r:#D4443C;--r-s:#FCEBE9;--a:#A86F00;--a-s:#FFF3D6;--gr-s:#EEF0F3;
  --sh:0 1px 2px rgba(16,24,40,.05),0 10px 30px rgba(16,24,40,.08);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1115;--panel:#171A21;--panel2:#1B1F27;--line:#272C36;--text:#ECEEF2;--mut:#9AA3B2;--faint:#6B7383;
  --acc:#8B8BF0;--acc-s:#23244A;--acc-t:#B1B1FF;--on:#101223;
  --g:#3CC795;--g-s:#12302A;--r:#F07A72;--r-s:#3A1C1B;--a:#E7B04A;--a-s:#3A2E12;--gr-s:#22262F;
  --sh:0 10px 30px rgba(0,0,0,.45);
}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg{flex:none}
.mut{color:var(--mut)} .faint{color:var(--faint)} .grow{flex:1}
.row{display:flex;align-items:center;gap:8px}
#app{height:100vh;display:flex;flex-direction:column}

/* top bar */
.top{height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:.2px}
.logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#7A7AF0,#4B4BC8);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;background:var(--gr-s);font-size:12.5px;color:var(--mut)}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--gr-s)}
.seg button{height:28px;padding:0 14px;border-radius:7px;font-size:13px;color:var(--mut);font-weight:500}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(16,24,40,.12)}
.icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--mut);position:relative}
.icon:hover{background:var(--gr-s);color:var(--text)}
.icon .dot{position:absolute;top:3px;right:2px;min-width:16px;height:16px;border-radius:8px;background:var(--r);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px;font-weight:600}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--acc-s);color:var(--acc-t);display:grid;place-items:center;font-weight:600;font-size:13px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:13.5px;font-weight:500;transition:.12s}
.btn:hover{background:var(--panel2);border-color:var(--faint)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--on)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.good{background:var(--g);border-color:var(--g);color:#fff}
.btn.good:hover{filter:brightness(1.06)}
.btn.danger{color:var(--r);border-color:color-mix(in srgb,var(--r) 35%,var(--line))}
.btn.danger:hover{background:var(--r-s)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.lg{height:38px;padding:0 18px}

/* workbench */
.work{flex:1;display:grid;grid-template-columns:352px 1fr;min-height:0}
.list{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.lh{padding:14px 14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.prog .row{justify-content:space-between;font-size:12.5px;margin-bottom:6px}
.bar{height:6px;border-radius:3px;background:var(--gr-s);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7A7AF0,var(--acc));border-radius:3px;transition:width .4s}
.hint{font-size:12px;color:var(--mut);display:flex;gap:6px;align-items:flex-start;line-height:1.45}
.ftoks{display:flex;flex-wrap:wrap;gap:6px}
.tok{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 4px 0 9px;border-radius:12px;background:var(--acc-s);color:var(--acc-t);font-size:12px}
.tok button{width:16px;height:16px;border-radius:8px;display:grid;place-items:center;opacity:.7}
.tok button:hover{opacity:1;background:rgba(91,91,214,.18)}
.lscroll{flex:1;overflow:auto;padding:6px 8px 80px}
.gh{padding:12px 8px 6px;font-size:12px;color:var(--faint);font-weight:600;display:flex;gap:6px;align-items:center}
.gh span{background:var(--gr-s);border-radius:9px;padding:0 7px;font-weight:500;color:var(--mut)}
.it{display:flex;gap:10px;padding:10px;border-radius:10px;cursor:pointer;border:1px solid transparent;margin-bottom:2px}
.it:hover{background:var(--panel2)}
.it.sel{background:var(--acc-s);border-color:color-mix(in srgb,var(--acc) 25%,transparent)}
.ib{min-width:0;flex:1}
.r1{display:flex;align-items:center;gap:7px;font-size:12px}
.id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--mut)}
.tt{font-weight:550;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sti{width:20px;height:20px;margin-top:2px;border-radius:50%;display:grid;place-items:center;flex:none}
.sti.review{border:2px solid var(--acc);background:var(--acc-s)}
.sti.review::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc)}
.sti.queued,.sti.passed{color:var(--faint)}
.sti.accepted{background:var(--g-s);color:var(--g)}
.sti.rejected{background:var(--r-s);color:var(--r)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--acc-s);border-top-color:var(--acc);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pri{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--mut)}
.pri i{width:7px;height:7px;border-radius:50%}
.tag{display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 7px;border-radius:5px;font-size:11px;font-weight:600}
.tag.acc{background:var(--acc);color:var(--on)}
.tag.amb{background:var(--a-s);color:var(--a)}
.tag.g{background:var(--g-s);color:var(--g)}
.tag.r{background:var(--r-s);color:var(--r)}
.tag.gr{background:var(--gr-s);color:var(--mut)}
.tag.sa{background:var(--acc-s);color:var(--acc-t)}

/* detail */
.detail{display:flex;flex-direction:column;min-height:0;min-width:0}
.dscroll{flex:1;overflow:auto;padding:28px 36px 40px}
.dwrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.dh h1{font-size:22px;line-height:1.35;margin:8px 0 14px;letter-spacing:.2px}
.dh1{display:flex;align-items:center;gap:10px}
.kv{display:flex;flex-wrap:wrap;gap:8px 28px}
.kv label{display:block;font-size:11.5px;color:var(--faint);margin-bottom:1px}
.kv span{font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card.warn{background:var(--a-s);border-color:color-mix(in srgb,var(--a) 30%,transparent)}
.card.info{background:var(--acc-s);border-color:color-mix(in srgb,var(--acc) 25%,transparent)}
.ct{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:8px}
.ct .sub{margin-left:auto;font-weight:400;font-size:12px;color:var(--faint)}
.card p{color:var(--text);opacity:.88}
.card ul{padding-left:18px;display:flex;flex-direction:column;gap:4px}
.concl{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px dashed var(--line);font-size:13px;color:var(--mut)}
.concl b{color:var(--text)}
.steps{display:flex;gap:0}
.stp{flex:1;display:flex;flex-direction:column;gap:6px;position:relative;font-size:12.5px;color:var(--faint)}
.stp .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--gr-s);color:var(--faint);font-size:11px;font-weight:700;position:relative;z-index:1}
.stp::before{content:"";position:absolute;top:10px;left:22px;right:-0px;height:2px;background:var(--gr-s)}
.stp:last-child::before{display:none}
.stp.done{color:var(--mut)} .stp.done .n{background:var(--g);color:#fff} .stp.done::before{background:var(--g)}
.stp.cur{color:var(--text);font-weight:600} .stp.cur .n{background:var(--acc);color:var(--on)}
.gitline{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.file{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:10px}
.fh{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel2);cursor:pointer;font-size:12.5px}
.fh .chev{transition:.15s;color:var(--faint)} .file.open .chev{transform:rotate(90deg)}
.fh .add{color:var(--g)} .fh .del{color:var(--r)}
.diff{display:none;font:12px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;overflow:auto}
.file.open .diff{display:block}
.diff div{padding:0 12px;white-space:pre}
.diff .p{background:var(--g-s);color:var(--g)} .diff .m{background:var(--r-s);color:var(--r)} .diff .c{color:var(--faint)}
.sk{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--gr-s),var(--panel2),var(--gr-s));background-size:200% 100%;animation:sh 1.4s infinite;margin:8px 0}
@keyframes sh{to{background-position:-200% 0}}
.act{flex:none;border-top:1px solid var(--line);background:var(--panel);padding:14px 36px}
.actin{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px}
.empty{margin:auto;text-align:center;color:var(--mut);max-width:360px}
.empty .big{width:64px;height:64px;border-radius:20px;background:var(--acc-s);color:var(--acc);display:grid;place-items:center;margin:0 auto 16px}
.empty h2{color:var(--text);margin-bottom:6px}
.res{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.cmt{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:13px}
.tl{list-style:none;padding:0!important;gap:8px!important}
.tl li{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut)}
.tl li svg{color:var(--g)}

/* overlays */
#pop{position:fixed;z-index:30}
.pop{width:380px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column;gap:14px}
.pop label.l{font-size:12px;font-weight:600;color:var(--mut);display:block;margin-bottom:7px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.cp{height:28px;padding:0 11px;border-radius:14px;border:1px solid var(--line);font-size:12.5px;color:var(--mut);display:inline-flex;align-items:center;gap:6px}
.cp:hover{border-color:var(--faint)}
.cp.on{background:var(--acc-s);border-color:var(--acc);color:var(--acc-t);font-weight:500}
.inp,.ta{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:0 11px;height:34px;font:inherit;color:var(--text);outline:none}
.ta{height:84px;padding:9px 11px;resize:none}
.inp:focus,.ta:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-s)}
.acl{margin-top:4px;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.acl button{display:block;width:100%;text-align:left;padding:7px 11px;font-size:13px}
.acl button:hover{background:var(--acc-s)}
.acl em{font-style:normal;color:var(--acc);font-weight:600}
.pf{display:flex;justify-content:space-between;align-items:center}
.mask{position:fixed;inset:0;background:rgba(10,12,18,.45);backdrop-filter:blur(3px);z-index:40;display:grid;place-items:center;animation:fi .15s}
@keyframes fi{from{opacity:0}}
.modal{width:520px;max-width:92vw;background:var(--panel);border-radius:18px;box-shadow:var(--sh);padding:24px;animation:up .18s}
@keyframes up{from{transform:translateY(10px);opacity:0}}
.modal h3{font-size:17px;margin-bottom:4px}
.modal .sub{color:var(--mut);margin-bottom:16px;font-size:13px}
.modal footer{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.ostep{list-style:none;padding:0;display:flex;flex-direction:column;gap:2px}
.ostep li{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:13.5px;color:var(--mut)}
.ostep li .b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--gr-s);font-size:11px;font-weight:700;color:var(--faint)}
.ostep li.run{color:var(--text)} .ostep li.run .b{background:none}
.ostep li.ok{color:var(--text)} .ostep li.ok .b{background:var(--g);color:#fff}
.ostep code{background:var(--gr-s);padding:1px 6px;border-radius:5px;font-size:12px}
.rc{display:flex;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;margin-bottom:10px;width:100%;text-align:left}
.rc.on{border-color:var(--acc);background:var(--acc-s)}
.rc .rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--faint);margin-top:2px;flex:none;display:grid;place-items:center}
.rc.on .rd{border-color:var(--acc)} .rc.on .rd::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc)}
.rc b{display:block;font-weight:600} .rc span{font-size:12.5px;color:var(--mut)}
.note{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:12.5px;color:var(--mut)}
#toasts{position:fixed;top:62px;right:16px;z-index:50;display:flex;flex-direction:column;gap:10px;width:340px}
.toast{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:12px 14px;display:flex;gap:11px;animation:in .25s;cursor:pointer}
@keyframes in{from{transform:translateX(30px);opacity:0}}
.toast .ti{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
.toast b{display:block;font-size:13.5px} .toast span{font-size:12.5px;color:var(--mut);display:block}
.bell{width:360px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
.bell h4{padding:12px 16px;border-bottom:1px solid var(--line);font-size:13.5px;display:flex;justify-content:space-between}
.bi{display:flex;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.bi:hover{background:var(--panel2)} .bi:last-child{border:0}
.bi small{color:var(--faint);display:block}
.bi .u{width:7px;height:7px;border-radius:50%;background:var(--acc);margin-top:7px;flex:none}

/* pages */
.page{flex:1;overflow:auto;padding:32px 24px 90px}
.pw{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.pw h1{font-size:24px;margin-bottom:2px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px 20px}
.sr{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.sr:last-child{border:0}
.si{width:38px;height:38px;border-radius:11px;background:var(--acc-s);color:var(--acc);display:grid;place-items:center;flex:none}
.sr .tx{flex:1;min-width:0} .sr .tx b{display:block;font-weight:600} .sr .tx span{font-size:12.5px;color:var(--mut)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;width:100%}
.sw{width:38px;height:22px;border-radius:11px;background:var(--line);position:relative;transition:.15s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--acc)} .sw.on::after{left:18px}
.hero{text-align:center;margin:20px 0 8px}
.hero .logo{width:56px;height:56px;border-radius:17px;font-size:28px;margin:0 auto 16px}
.hero h1{font-size:28px} .hero p{color:var(--mut);margin-top:6px}
.demo{position:fixed;bottom:12px;left:12px;z-index:60;display:flex;gap:2px;padding:4px;border-radius:12px;background:rgba(23,26,33,.88);backdrop-filter:blur(10px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.demo button{height:28px;padding:0 12px;border-radius:8px;color:#C9CED8;font-size:12.5px}
.demo button:hover{background:rgba(255,255,255,.1);color:#fff}
.demo button.on{background:rgba(255,255,255,.16);color:#fff}
.demo i{width:1px;background:rgba(255,255,255,.15);margin:4px 4px}
</style>
</head>
<body>
<div id="app"></div>
<div id="pop"></div>
<div id="toasts"></div>
<div id="modal"></div>
<div class="demo" id="demo"></div>
<script>
/* ========== 图标 ========== */
const IC={
 bell:'<path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 003.4 0"/>',

 folder:'<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',

 layers:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 back:'<path d="M15 6l-6 6 6 6"/>',
 chat:'<path d="M21 12a8 8 0 01-11.5 7.2L4 20l1-4.5A8 8 0 1121 12z"/>',
 party:'<path d="M4 20l4-12 8 8z"/><path d="M14 4v2M19 9h2M17 5l1-1M10 3h.01"/>',
 info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',

function badge(d){const m={review:'sa',analyzing:'sa',queued:'gr',passed:'gr',accepted:'g',rejected:'r'};return `<span class="tag ${m[d.state]}">${STATUS[d.state]}</span>`}
function passes(d){
  if(F.types.size&&!F.types.has(d.type))return false;
  if(F.pris.size&&!F.pris.has(d.pri))return false;
  if(F.ver&&d.ver!==F.ver)return false;
  if(F.req&&d.req!==F.req)return false;
  return true;
}

function listHTML(){

  const toks=[...F.types].map(t=>tok(t,`rmF('types','${t}')`)).concat([...F.pris].map(t=>tok(t,`rmF('pris','${t}')`)));
  if(F.ver)toks.push(tok('版本 '+F.ver,`rmF('ver')`));
  if(F.req)toks.push(tok('需求 '+F.req,`rmF('req')`));

   <div class="lscroll">
    ${grp('待你审核',L.filter(d=>d.state==='review'))}

   </div>`;
}
const tok=(t,fn)=>`<span class="tok">${esc(t)}<button onclick="${fn}">${ic('x',10)}</button></span>`;

/* ========== 详情 ========== */
function head(d){
  return `<div class="dh"><div class="dh1"><span class="id">${d.id}</span>${badge(d)}${priDot(d.pri)}</div><h1>${esc(d.title)}</h1>
   <div class="kv"><div><label>类型</label><span>${d.type}</span></div><div><label>规划版本</label><span>${d.ver}</span></div>
   <div><label>关联需求</label><span>${d.req}</span></div><div><label>报告人</label><span>${d.who}</span></div><div><label>提出时间</label><span>${d.time}</span></div></div></div>
   <div class="card"><div class="ct">${ic('chat',16)}缺陷描述<span class="sub">来自飞书</span></div><p>${esc(d.desc)}</p></div>`;
}
function stepper(cur){
  return `<div class="card"><div class="steps">${STEPS.map((s,i)=>`<div class="stp ${i<cur?'done':i===cur?'cur':''}"><div class="n">${i<cur?ic('check',12):i+1}</div>${s}</div>`).join('')}</div></div>`;
}
function fixCards(d){
  const f=d.fix;
  const files=f.files.map((x,i)=>`<div class="file ${i===0?'open':''}"><div class="fh" onclick="this.parentNode.classList.toggle('open')">
    <span class="chev">${ic('chev',14)}</span>${ic('file',14)}<span class="mono">${x.name}</span><span class="grow"></span><span class="mono add">+${x.add}</span><span class="mono del">−${x.del}</span></div>
    <div class="diff">${x.lines.map(l=>`<div class="${l[0]}">${esc(l[1])}</div>`).join('')}</div></div>`).join('');
  return `
   <div class="card"><div class="ct">${ic('spark',16)}AI 判断<span class="tag g">可通过代码修复 · 置信度 ${f.conf}%</span></div><p>${f.judge}</p></div>
   ${stepper(3)}
   <div class="card"><div class="ct">${ic('layers',16)}修复方案<span class="sub">${f.files.length} 个文件 · +${f.files.reduce((a,x)=>a+x.add,0)} −${f.files.reduce((a,x)=>a+x.del,0)}</span></div>
    <ul>${f.summary.map(s=>`<li>${s}</li>`).join('')}</ul>
    <div class="gitline"><span class="chip">${ic('branch',13)}<span class="mono">${f.branch}</span></span><span class="chip mono">${f.commit}</span><span class="chip">基于 main</span></div>
    <div class="concl"><b>结论摘要</b>(已缓存,供后续缺陷参考):${f.conclusion}</div>
    ${files}</div>
   ${f.recheck?`<div class="card info"><div class="ct">${ic('refresh',16)}复核结果</div><p>${f.recheck}</p></div>`:''}
   ${f.conflicts.length?`<div class="card warn"><div class="ct">${ic('alert',16)}关联提示</div>${f.conflicts.map(c=>`<p>与 <b>${c.with}</b> 修改了同一文件 <span class="mono">${c.file}</span>(第 ${c.range} 行附近)。建议先处理 ${c.with},再复核本方案。</p>`).join('')}</div>`:''}`;
}
function detailHTML(){
  const d=get(sel);
  if(!d){
    const c=s=>D.filter(x=>x.state===s).length;
    return `<div class="dscroll" style="display:flex"><div class="empty"><div class="big">${ic('party',30)}</div><h2>全部处理完成</h2>
      <p>接受 ${c('accepted')} · 拒绝 ${c('rejected')} · 跳过 ${c('passed')}<br>FixMate 会继续监听,有新缺陷会第一时间通知你。</p></div></div>`;
  }
  let body='',act='';
  if(d.state==='review'){
    const stale=d.stale;
    body=head(d)
     +(stale?`<div class="card info"><div class="ct">${ic('refresh',16)}此方案需要复核<span class="sub">生成于 ${d.cached.time} · 基线 ${d.cached.base}</span></div>
        <p>该方案在 Auto 模式下、你处理其它缺陷期间生成,基于较早的代码。接受前,AI 会结合<b>最新 main</b> 与下方<b>缓存结论</b>重新评估,避免与已合入的修改冲突。</p>
        <div class="concl"><b>缓存结论</b>:${d.cached.text}</div>
        <div style="margin-top:12px"><button class="btn primary sm" onclick="recheck('${d.id}')" ${rechecking[d.id]?'disabled':''}>${rechecking[d.id]?'<span class="spin"></span>正在复核…':ic('refresh',14)+'立即复核'}</button></div></div>`:'')
     +fixCards(d);
    act=`<div class="act"><div class="actin"><span class="hint grow">${stale?'请先完成复核,再接受该方案':'接受后将 cherry-pick 到 main、push 并通过 Jenkins 打 OTA'}</span>
      <button class="btn" onclick="openPass('${d.id}')">${ic('skip',14)}跳过</button>
      <button class="btn danger" onclick="openReject('${d.id}')">${ic('x',14)}拒绝</button>
      <button class="btn good lg" onclick="openAccept('${d.id}')" ${stale?'disabled':''}>${ic('check',16)}接受并发布</button></div></div>`;
  }else if(d.state==='analyzing'){
    body=head(d)+stepper(Math.min(d.step,2))+`<div class="card"><div class="ct"><div class="spin"></div>AI 正在处理<span class="sub">${STEPS[Math.min(d.step,2)]}…</span></div><div class="sk" style="width:90%"></div><div class="sk" style="width:72%"></div><div class="sk" style="width:81%"></div></div>`;
  }else if(d.state==='queued'){
    body=head(d)+`<div class="card"><div class="ct">${ic('clock',16)}排队中</div><p>${mode==='one'?'One by one 模式:将在上一个缺陷处理完成后自动开始。':'Auto 模式:有空闲并发名额时自动开始(最多同时 3 个)。'}</p></div>`;
  }else if(d.state==='passed'){
    body=head(d)+`<div class="card"><div class="ct">${ic('skip',16)}已跳过${d.auto?'<span class="tag sa">AI 自动判断</span>':''}</div><p>${esc(d.reason)}</p></div>`;
  }else if(d.state==='rejected'){
    body=head(d)+`<div class="card"><div class="ct">${ic('x',16)}已拒绝该方案</div><p>${d.reason?esc(d.reason):'未填写原因'}</p>
      <div class="res"><span class="tag ${d.kept?'g':'gr'}">${d.kept?'已保留 AI 修改':'已丢弃 AI 修改'}</span></div>
      ${d.kept?`<div class="note">修改已通过 <span class="mono">git cherry-pick -n</span> 放入 main 的工作区(未提交),临时分支已删除。</div>`:''}</div>`;
  }else if(d.state==='accepted'){
    body=head(d)+`<div class="card"><div class="ct">${ic('check',16)}已接受并发布<span class="sub">${d.commit?'commit '+d.commit:''}</span></div>
      <ul class="tl">${['已 cherry-pick 到 main 并 push','已删除本地临时分支','Jenkins 已打包 OTA','飞书缺陷已标记为已解决'].map(t=>`<li>${ic('check',14)}${t}</li>`).join('')}</ul>

  }
  return `<div class="dscroll"><div class="dwrap">${body}</div></div>${act}`;
}

}

 <div class="sr"><div class="si">${ic('chat',18)}</div><div class="tx"><b>飞书账号</b><span>已授权 · 用于拉取分配给你的缺陷、回写状态与评论</span></div><span class="tag g">已连接</span><button class="btn sm">重新授权</button></div>
 <div class="sr"><div class="si">${ic('user',18)}</div><div class="tx"><b>Git 身份</b><span>使用本机 git 配置 · user.name / user.email 已检测</span></div><span class="tag g">已检测</span></div>
 <div class="sr" style="flex-wrap:wrap"><div class="si">${ic('folder',18)}</div><div class="tx"><b>工作仓库</b><span>FixMate 只会在这个仓库里创建临时分支和提交</span></div><button class="btn sm">选择文件夹…</button>
   <div class="fg"><input class="inp" value="~/Documents/MBO/mbo-android" readonly><select class="inp"><option>主分支:main</option><option>develop</option></select></div></div>
 <div class="sr" style="flex-wrap:wrap"><div class="si">${ic('rocket',18)}</div><div class="tx"><b>Jenkins 打包</b><span>接受方案并 push 后,通过 REST API 触发 OTA 并记录版本号</span></div><button class="btn sm">测试连接</button>
   <div class="fg"><input class="inp" placeholder="Jenkins 地址" value="https://jenkins.mbo.local"><input class="inp" placeholder="Job 名称" value="android-ota"><input class="inp" placeholder="用户名" value="ci-bot"><input class="inp" type="password" placeholder="API Token" value="••••••••••"></div></div>`}
function settingsHTML(){return `<div class="pw">
  <div class="row"><button class="btn sm" onclick="go('work')">${ic('back',14)}返回工作台</button></div>
  <div><h1>设置</h1><span class="mut">账号、仓库与打包配置</span></div>
  <div class="sec">${rows()}</div>
  <div class="sec">
   <div class="sr"><div class="si">${ic('bell',18)}</div><div class="tx"><b>收到新缺陷时通知</b><span>应用内弹窗 + 系统通知</span></div>${sw(true)}</div>
   <div class="sr"><div class="si">${ic('party',18)}</div><div class="tx"><b>全部处理完成时通知</b><span>目标缺陷清空后提醒你</span></div>${sw(true)}</div>
   <div class="sr"><div class="si">${ic('zap',18)}</div><div class="tx"><b>默认工作模式</b><span>启动时使用的模式</span></div><div class="seg"><button>One by one</button><button class="on">Auto</button></div></div>
   <div class="sr"><div class="si">${ic('filter',18)}</div><div class="tx"><b>默认筛选条件</b><span>类型:Bug、历史遗留问题 · 优先级:Blocker、Critical、Major</span></div><button class="btn sm">编辑</button></div>
  </div></div>`}
function onboardHTML(){return `<div class="pw"><div class="hero"><div class="logo">F</div><h1>欢迎使用 FixMate</h1><p>自动拉取飞书缺陷,让 AI 帮你修,你只负责审核。</p></div>
  <div class="sec">${rows()}</div>
  <div style="text-align:center"><button class="btn primary lg" onclick="go('work')">开始使用</button></div></div>`}

/* ========== 筛选浮层 ========== */
function openFilter(e){
  e.stopPropagation();
  if($('#pop').innerHTML){closePop();return}
  const r=$('#fbtn').getBoundingClientRect();
  $('#pop').style.left=r.left+'px';$('#pop').style.top=(r.bottom+8)+'px';
  renderPop();
}
function renderPop(){
  const chips=(arr,set,k)=>arr.map(t=>`<button class="cp ${F[set].has(t)?'on':''}" onclick="togF('${set}','${t}')">${k?`<i style="width:7px;height:7px;border-radius:50%;background:${PRI[t]}"></i>`:''}${t}</button>`).join('');
  const ac=(k,label,ph)=>`<div><label class="l">${label}</label>${F[k]?`<div class="ftoks">${tok(F[k],`rmF('${k}')`)}</div>`:`<input class="inp" placeholder="${ph}" oninput="ac('${k}',this.value)"><div id="ac-${k}"></div>`}</div>`;
  $('#pop').innerHTML=`<div class="pop" onclick="event.stopPropagation()">
   <div><label class="l">缺陷类型</label><div class="chips">${chips(TYPES,'types')}</div></div>
   <div><label class="l">优先级</label><div class="chips">${chips(Object.keys(PRI),'pris',1)}</div></div>
   ${ac('ver','关联需求的规划版本','输入版本,如 3.8')}
   ${ac('req','关联需求','输入需求名称,如 账号')}
   <div class="pf"><button class="btn sm" onclick="clearF()">清除全部</button><button class="btn primary sm" onclick="closePop()">完成</button></div></div>`;
}
const fuzzy=(q,s)=>{q=q.toLowerCase().replace(/\s/g,'');s=s.toLowerCase().replace(/\s/g,'');let i=0;for(const c of s){if(c===q[i])i++}return i===q.length};
function ac(k,q){
  const box=$('#ac-'+k);if(!q.trim()){box.innerHTML='';return}
  const src=k==='ver'?VERS:REQS, hits=src.filter(s=>fuzzy(q,s));
  box.innerHTML=hits.length?`<div class="acl">${hits.map(h=>`<button onclick="setF('${k}','${h}')">${esc(h)}</button>`).join('')}</div>`:`<div class="faint" style="font-size:12px;padding:6px 2px">没有匹配项</div>`;
}
function togF(set,t){F[set].has(t)?F[set].delete(t):F[set].add(t);renderPop();renderList()}
function setF(k,v){F[k]=v;renderPop();renderList()}
function rmF(k,t){if(t!==undefined)F[k].delete(t);else F[k]='';if($('#pop').innerHTML)renderPop();renderList()}
function clearF(){F.types.clear();F.pris.clear();F.ver='';F.req='';renderPop();renderList()}
function closePop(){$('#pop').innerHTML=''}
document.addEventListener('click',e=>{if(!e.target.closest('#pop')&&!e.target.closest('#fbtn'))closePop()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePop();closeModal()}});

/* ========== 通知 ========== */
function notify(title,body,kind,id){
  const n={title,body,kind,id,unread:true,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})};
  notifs.unshift(n);renderTop();
  const col={new:['--acc-s','--acc','bell'],ok:['--g-s','--g','check'],skip:['--gr-s','--mut','skip'],done:['--g-s','--g','party'],warn:['--a-s','--a','alert']}[kind]||['--acc-s','--acc','bell'];
  const t=document.createElement('div');t.className='toast';
  t.innerHTML=`<div class="ti" style="background:var(${col[0]});color:var(${col[1]})">${ic(col[2],17)}</div><div><b>${esc(title)}</b><span>${esc(body)}</span></div>`;
  t.onclick=()=>{if(id&&get(id)){view='work';sel=id;render()}t.remove()};
  $('#toasts').append(t);setTimeout(()=>t.remove(),6500);
}
function toggleBell(e){
  e.stopPropagation();
  if($('#pop').innerHTML){closePop();return}
  const r=e.currentTarget.getBoundingClientRect();
  $('#pop').style.left=(r.right-360)+'px';$('#pop').style.top=(r.bottom+8)+'px';
  $('#pop').innerHTML=`<div class="bell" onclick="event.stopPropagation()"><h4><b>通知</b><span class="faint">${notifs.length} 条</span></h4>
   ${notifs.length?notifs.map(n=>`<div class="bi" onclick="closePop();${n.id?`view='work';sel='${n.id}';render()`:''}">${n.unread?'<i class="u"></i>':'<i style="width:7px"></i>'}<div><b>${esc(n.title)}</b><span class="mut">${esc(n.body)}</span><small>${n.time}</small></div></div>`).join(''):'<div class="faint" style="padding:24px;text-align:center">暂无通知</div>'}</div>`;
  notifs.forEach(n=>n.unread=false);renderTop();
}

/* ========== 调度模拟 ========== */
function setMode(m){mode=m;renderTop();renderList();tick()}
function start(d){d.state='analyzing';d.step=0}
function tick(){
  const q=D.filter(d=>d.state==='queued');
  if(mode==='one'){if(!D.some(d=>d.state==='analyzing'||d.state==='review')&&q[0])start(q[0])}
  else q.slice(0,Math.max(0,3-D.filter(d=>d.state==='analyzing').length)).forEach(start);
  if(!D.some(d=>['queued','analyzing','review'].includes(d.state))&&D.length&&!doneNotified){
    doneNotified=true;notify('目标缺陷已全部处理完成','继续监听中,有新缺陷会通知你','done');
    if(!get(sel)||['queued','analyzing'].includes(get(sel).state)){}
  }
  renderList();renderDetail();
}
setInterval(()=>{
  let changed=false;
  D.filter(d=>d.state==='analyzing').forEach(d=>{
    d.step++;changed=true;
    if(!d.fixable&&d.step>=2){d.state='passed';d.auto=true;d.reason='AI 判断:这是一条产品体验类建议,没有确定的代码修改目标,已自动跳过。如需处理请手动调整。';notify(`AI 已跳过 ${d.id}`,'不是可通过改代码解决的确定问题','skip',d.id)}
    else if(d.step>=3){
      d.state='review';
      d.stale=mode==='auto'&&D.some(x=>x!==d&&x.state==='review');
      d.fix=d.fix||{conf:85+Math.floor(Math.random()*10),branch:'fixmate/'+d.id,commit:Math.random().toString(16).slice(2,9),judge:'问题描述明确,可通过修改代码解决。',summary:['定位到相关模块并修复','补充必要的测试'],conclusion:'已分析根因并完成修复,详见 diff。',files:[{name:'src/modules/'+d.req.replace(/\s/g,'')+'/index.ts',add:8,del:3,lines:[['c','@@ -20,6 +20,11 @@'],['m','-   return legacy(x)'],['p','+   return safe(x)']]}],conflicts:[]};
      if(d.stale)d.cached={time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),base:'a3f9c21',text:d.fix.conclusion};
      notify(`方案已就绪 · ${d.id}`,d.title,'new',d.id);
    }
  });
  if(changed)tick();
},1600);

function recheck(id){
  rechecking[id]=true;renderDetail();
  setTimeout(()=>{
    const d=get(id);d.stale=false;rechecking[id]=false;
    d.fix.recheck='已结合最新 main(含已合入的相关修改)与缓存结论重新评估:原方案调整为复用已有的校验函数,冲突已消除。';
    d.fix.conflicts=[];d.fix.commit=Math.random().toString(16).slice(2,9);
    notify('复核完成',`${id} 的方案已基于最新代码更新`,'ok',id);renderList();renderDetail();
  },1800);
}
function simNew(){
  const t=NEWPOOL[newN++%NEWPOOL.length];
  const d={...t,id:(t.type==='建议'?'SUG-':'BUG-')+(2490+newN),who:'飞书同学',time:'刚刚',state:'queued',desc:'(模拟的新缺陷)'+t.title+'。'};
  D.unshift(d);doneNotified=false;view='work';render();
  notify('收到新缺陷',`${d.id} · ${d.pri} · ${d.title}`,'new',d.id);
  tick();
}

/* ========== 弹窗 ========== */
function modal(html){$('#modal').innerHTML=`<div class="mask" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()">${html}</div></div>`}
function closeModal(){$('#modal').innerHTML=''}
function finish(d){
  if(sel===d.id){const nx=curReview();sel=nx?nx.id:sel}
  closeModal();tick();
}
let keep=true;
function openReject(id){
  keep=true;
  modal(`<h3>拒绝 ${id} 的修复方案</h3><div class="sub">被拒绝的方案仍可能有价值,你可以选择是否保留。</div>
   <div id="rc"></div>
   <label class="mut" style="font-size:12.5px;display:block;margin:6px 0">拒绝原因(可选)</label><textarea class="ta" id="rr" placeholder="例如:思路对,但改动范围偏大"></textarea>
   <footer><button class="btn" onclick="closeModal()">取消</button><button class="btn danger" onclick="doReject('${id}')">确认拒绝</button></footer>`);
  rcRender();
}
function rcRender(){
  $('#rc').innerHTML=`<button class="rc ${keep?'on':''}" onclick="keep=true;rcRender()"><div class="rd"></div><div><b>保留 AI 的修改</b><span>用 <span class="mono">git cherry-pick -n</span> 放入 main 工作区(不提交),方便你在此基础上继续改</span></div></button>
   <button class="rc ${keep?'':'on'}" onclick="keep=false;rcRender()"><div class="rd"></div><div><b>丢弃修改</b><span>仅删除临时分支,不改动 main</span></div></button>`;
}
function doReject(id){const d=get(id);d.state='rejected';d.kept=keep;d.reason=$('#rr').value.trim();notify(`已拒绝 ${id}`,keep?'AI 修改已保留到工作区':'AI 修改已丢弃','skip');finish(d)}
const PASSR=['需求不明确','无法复现','不是代码问题','稍后处理'];
function openPass(id){
  modal(`<h3>跳过 ${id}</h3><div class="sub">跳过后不会修改任何代码,请简单备注原因。</div>
   <div class="chips" style="margin-bottom:10px">${PASSR.map(r=>`<button class="cp" onclick="$('#pr').value='${r}';$('#pb').disabled=false">${r}</button>`).join('')}</div>
   <textarea class="ta" id="pr" placeholder="跳过原因(必填)" oninput="$('#pb').disabled=!this.value.trim()"></textarea>
   <footer><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" id="pb" disabled onclick="doPass('${id}')">确认跳过</button></footer>`);
}
function doPass(id){const d=get(id);d.state='passed';d.auto=false;d.reason=$('#pr').value.trim();notify(`已跳过 ${id}`,d.reason,'skip');finish(d)}
const ASTEPS=(d)=>['切换到主分支 <code>main</code>',`cherry-pick <code>${d.fix.branch}</code> 上的提交`,'删除本地临时分支','push 到 <code>origin/main</code>','调用 Jenkins 打 OTA 包','在飞书将缺陷标记为「已解决」','在飞书评论中备注版本号 <code>#{ota_version}</code>'];
function openAccept(id){
  const d=get(id);
  modal(`<h3>接受 ${id} 的修复方案</h3><div class="sub">确认后将自动完成以下步骤,无需手动操作。</div>
   <ul class="ostep">${ASTEPS(d).map((s,i)=>`<li><span class="b">${i+1}</span><span>${s}</span></li>`).join('')}</ul>
   <div class="note">评论格式:<span class="mono">#{ota_version}</span>,例如 <span class="mono">#3.8.0.2417</span></div>
   <footer><button class="btn" onclick="closeModal()">取消</button><button class="btn good" onclick="runAccept('${id}')">${ic('check',15)}确认接受</button></footer>`);
}
function runAccept(id){
  const d=get(id), ota='3.8.0.'+(2400+Math.floor(Math.random()*90)), S=ASTEPS(d);
  S[4]='Jenkins 打 OTA 包(预计约 1 分钟)';
  const paint=(n)=>{
    const box=$('#modal .modal');if(!box)return;
    box.innerHTML=`<h3>${n>=7?'已接受并发布':'正在处理 '+id}</h3><div class="sub">${n>=7?'缺陷已标记为 accepted。':'请稍候,期间可以关闭窗口,过程在后台继续。'}</div>
     <ul class="ostep">${S.map((s,i)=>{
       const st=i<n?'ok':i===n?'run':'';
       const txt=i===4&&i<n?`OTA 已完成,版本号 <code>${ota}</code>`:i===6&&i<n?`已评论 <code>#${ota}</code>`:s;
       return `<li class="${st}"><span class="b">${i<n?ic('check',12):i===n?'<div class="spin"></div>':i+1}</span><span>${txt}</span></li>`}).join('')}</ul>
     <footer>${n>=7?`<button class="btn primary" onclick="closeModal()">完成</button>`:`<button class="btn" onclick="closeModal()">转到后台</button>`}</footer>`;
  };
  let n=0;paint(0);
  const next=()=>{
    n++;paint(n);
    if(n===7){d.state='accepted';d.ota=ota;d.commit=d.fix.commit;notify(`已接受 ${id}`,`OTA ${ota} 已打包,飞书已评论 #${ota}`,'ok',id);if(sel===id){const nx=curReview();if(nx)sel=nx.id}tick()}
    else setTimeout(next,n===4?1800:650);
  };
  setTimeout(next,650);
}

render();
tick();
</script>
</body>
</html>
